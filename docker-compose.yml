version: '3.8'

services:
  app:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/shopapi
    depends_on:
      - db
    command: >
      sh -c "
        sleep 5 &&
        alembic upgrade head &&
        python scripts/init_db.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shopapi
      - POSTGRES_PORT=5432
    ports:
      - "5432:5432"

volumes:
  postgres_data: